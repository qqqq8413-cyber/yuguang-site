      .rows{padding-bottom:clamp(48px,8vh,88px)}

      .rowhead h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.15rem,2.4vw,1.46rem);letter-spacing:5px}
      .rowhead .en{font-family:var(--serif);font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}

      .track::-webkit-scrollbar{display:none}
      .tile{flex:0 0 calc((100% - 4*var(--gap))/5);scroll-snap-align:start;position:relative;display:block;
                aspect-ratio:3/2;overflow:hidden;background:#e7e4dd;user-select:none} @media(max-width:1180px){.tile{flex-basis:calc((100% - 3*var(--gap))/4)}} @media(max-width:900px){.tile{flex-basis:calc((100% - 2*var(--gap))/3)}} @media(max-width:560px){.tile{flex-basis:78%}} .rowwrap{position:relative} .arrow{position:absolute;top:0;bottom:0;width:46px;display:flex;align-items:center;justify-content:center;z-index:5;border:0;cursor:pointer;font-family:var(--serif);font-size:26px;color:var(--ink);opacity:.7;transition:opacity .25s} .arrow:hover{opacity:1} .arrow.prev{left:0;background:linear-gradient(to right,var(--paper) 30%,rgba(243,241,236,0))} .arrow.next{right:0;background:linear-gradient(to left,var(--paper) 30%,rgba(243,241,236,0))} .arrow[hidden]{display:none}
      /* 平面／動態兩列放大:電腦一次約 3 張(露出下一張一截,暗示可左右滑),平板約 2 張,手機約 1 張 */
      .row.lg .tile{flex-basis:calc((100% - 3*var(--gap))/3.25)}

      @media(max-width:700px){.row.lg .tile{flex-basis:84%}}
      .row.lg .tile .cap{padding:22px 26px;font-size:clamp(17px,1.5vw,24px);letter-spacing:3px}

      .tile .bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 1s cubic-bezier(.19,1,.22,1)}

                     font-family:var(--serif);font-size:16px;letter-spacing:2px;line-height:1.35;

      /* ---- 進站動畫:在暗處用光把 LOGO 一筆一筆畫出來,再像暗房顯影一樣淡出成主視覺 ----

         「減少動態」、網址帶 #錨點、自動化工具(爬蟲)都不播。網址加 ?intro=1 可強制重看。
         緩動曲線直接寫數值,不依賴 site.css 的變數:萬一 site.css 晚到,動畫也不會失效。 */
      /* 注意:<html> 上的旗標是 is-intro,遮罩是 .intro,兩者不可同名——
         同名的話 .intro{display:none} 會連 <html> 一起隱藏,整頁在動畫結束前完全不會畫出來 */
      .intro{display:none}
      html.is-intro .intro{display:flex;position:fixed;inset:0;z-index:2000;flex-direction:column;align-items:center;justify-content:center;
        background:var(--ink);color:#f3f1ec;animation:intro-out .65s cubic-bezier(.65,0,.35,1) 1.6s forwards}
      .intro svg{width:clamp(52px,6vw,76px);height:auto;aspect-ratio:192/208;overflow:visible}
      .intro line{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:intro-draw var(--t) cubic-bezier(.65,0,.35,1) var(--d) forwards}
      .intro line.ray{filter:drop-shadow(0 0 5px rgba(243,241,236,.55))}
      .intro .nm{font-family:var(--serif);font-size:clamp(18px,1.9vw,24px);letter-spacing:12px;text-indent:12px;margin-top:30px;opacity:0;
        animation:intro-name 1s cubic-bezier(.19,1,.22,1) .8s forwards}
      .intro .lt{font-family:var(--serif);font-size:11px;letter-spacing:7px;text-indent:7px;margin-top:12px;opacity:0;
        animation:intro-fade .9s cubic-bezier(.19,1,.22,1) .98s forwards}
      @keyframes intro-draw{to{stroke-dashoffset:0}}
      @keyframes intro-name{from{opacity:0;letter-spacing:24px;text-indent:24px}to{opacity:1}}
      @keyframes intro-fade{to{opacity:.62}}
      @keyframes intro-out{to{opacity:0;visibility:hidden}}

      /* ---- 主視覺文字依序浮現(純 CSS,第一次繪製就套用,不會先閃一下) ----
         播進站動畫時整體往後延,接在顯影之後;跳過進站動畫時 JS 拿掉 is-intro-hero,就改用一般的時間點 */
      @media (prefers-reduced-motion:no-preference){

        .hero .inner>:nth-child(1){animation-delay:.12s}.hero .inner>:nth-child(2){animation-delay:.2s}
        .hero .inner>:nth-child(3){animation-delay:.3s}.hero .inner>:nth-child(4){animation-delay:.4s}
        .hero .actions{animation-delay:.52s}.hero .foot{animation-delay:.66s}
        html.is-intro-hero .hero .inner>:nth-child(1){animation-delay:1.62s}html.is-intro-hero .hero .inner>:nth-child(2){animation-delay:1.7s}
        html.is-intro-hero .hero .inner>:nth-child(3){animation-delay:1.8s}html.is-intro-hero .hero .inner>:nth-child(4){animation-delay:1.9s}
        html.is-intro-hero .hero .actions{animation-delay:2.02s}html.is-intro-hero .hero .foot{animation-delay:2.16s}
      }
      @keyframes hero-in{from{opacity:0;transform:translate3d(0,20px,0)}}

  <script>
    const rows=document.getElementById('rows');
    function opt(u,w){if(!u)return u;if(u.indexOf('res.cloudinary.com')>-1&&u.indexOf('/upload/')>-1){return u.replace('/upload/',`/upload/f_auto,q_auto,w_${w}/`);}return u;}
    function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
    /* 代表圖:自己指定的封面優先,再來才是第一張照片(專案也一樣) */
    function firstPhoto(node){
        if(node.cover)return node.cover;
        if(node.photos&&node.photos.length)return node.photos[0].image;
        if(node.projects)for(const pj of node.projects){
              if(pj.cover)return pj.cover;
              if(pj.photos&&pj.photos.length)return pj.photos[0].image;}
        return null;
    }
    /* 卡片的輪播圖:封面排第一張 */
    function tileImgs(node,w){const out=[];if(node.cover)out.push(opt(node.cover,w));
        (node.photos||[]).forEach(p=>{if(p.image&&p.image!==node.cover)out.push(opt(p.image,w));});
        return out.slice(0,6);}
    function tile(it){
        const imgs = (it.imgs&&it.imgs.length) ? it.imgs : (it.img?[it.img]:[]);
        const first = imgs[0];
        const bg = first&&it.product ? `background:url('${first}') center/contain no-repeat;background-origin:content-box` : first ? `background-image:url('${first}')` : it.icon ? `background:#e9e6df url('${it.icon}') center 38%/26% no-repeat` : 'background:linear-gradient(150deg,#c9c3b6,#8f897d)';
        const s = it.sub ? `<small>${esc(it.sub)}</small>` : '';
        return `<a class="tile${it.product?' prod':''}" href="${it.href}" data-imgs="${imgs.join('|')}"><div class="bg" style="${bg}"></div><div class="grain"></div><div class="cap">${esc(it.cap)}${s}</div></a>`;
    }
    function enableHover(){
        if(!window.matchMedia||!window.matchMedia('(hover:hover)').matches)return;
        document.querySelectorAll('.tile:not([data-h])').forEach(t=>{
              t.dataset.h='1';const imgs=(t.dataset.imgs||'').split('|').filter(Boolean);
              if(imgs.length<2)return;
              const bg=t.querySelector('.bg');let idx=0,timer=null,pre=false;
              t.addEventListener('pointerenter',()=>{if(!pre){pre=true;imgs.forEach(u=>{const im=new Image();im.src=u;});}timer=setInterval(()=>{idx=(idx+1)%imgs.length;bg.style.backgroundImage="url('"+imgs[idx]+"')";},900);});
              t.addEventListener('pointerleave',()=>{clearInterval(timer);idx=0;bg.style.backgroundImage="url('"+imgs[0]+"')";});
        });
    }
    function addRow(zh,en,more,items,size){
        const tiles = items.length ? items.map(tile).join('') : tile({href:more,img:null,cap:'尚無作品',sub:'點此進入'});
        rows.insertAdjacentHTML('beforeend',
                                    `<section class="row${size?' '+size:''}"><div class="rowhead"><h2>${zh}</h2><span class="en">${en}</span><a class="more" href="${more}">看全部 →</a></div><div class="rowwrap"><button class="arrow prev" aria-label="上一張" hidden>‹</button><div class="track">${tiles}</div><button class="arrow next" aria-label="下一張">›</button></div></section>`);
        bindArrows();
        
    }
    function bindArrows(){
        document.querySelectorAll('.rowwrap:not([data-a])').forEach(w=>{
              w.dataset.a='1';const tr=w.querySelector('.track'),pv=w.querySelector('.prev'),nx=w.querySelector('.next');
              const amt=()=>Math.max(tr.clientWidth*0.8,200);
              pv.addEventListener('click',()=>tr.scrollBy({left:-amt(),behavior:'smooth'}));
              nx.addEventListener('click',()=>tr.scrollBy({left:amt(),behavior:'smooth'}));
              const upd=()=>{const pad=parseFloat(getComputedStyle(tr).paddingLeft)||0,max=tr.scrollWidth-tr.clientWidth-2;pv.hidden=tr.scrollLeft<=pad+4;nx.hidden=tr.scrollLeft>=max;};
              tr.addEventListener('scroll',upd);window.addEventListener('resize',upd);setTimeout(upd,80);
        });
    }

    const GEARICON={'攝影機':'camera','相機機身':'camera','相機':'camera','燈光配件':'light','燈架':'tripod','鏡頭':'lens','燈光':'light','收音':'audio','穩定器':'gimbal','空拍機':'drone','腳架':'tripod'};
    /* 器材照片(去背):裁掉四周透明邊後完整顯示,不裁切 */
    function gimg(u,w){if(u&&u.indexOf('res.cloudinary.com')>-1&&u.indexOf('/upload/')>-1)return u.replace('/upload/',`/upload/e_trim:10/c_limit,w_${w},h_${w}/f_auto,q_auto/`);return opt(u,w);}
    function gearIcon(cat){return 'assets/gear-icons/'+(GEARICON[cat]||'other')+'.svg';}
    function ytid(s){s=String(s||'').trim();const m=s.match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{11})/);return m?m[1]:s;}

    /* 影片封面常內嵌電影黑邊;主視覺用 Cloudinary e_trim 先裁掉純色邊再放大 */
    function heroImg(u,w){if(u&&u.indexOf('res.cloudinary.com')>-1&&u.indexOf('/upload/')>-1)return u.replace('/upload/',`/upload/e_trim:20/f_auto,q_auto,w_${w||2000}/`);return u;}
    /* 主視覺輪播:精選影片中有自訂封面的優先(橫幅、高解析);不足 2 張時補平面作品照片 */
    function buildHero(v,a){
        const slides=[];
        (v.videos||[]).filter(x=>x.cover&&(x.featured===true||x.cat==='精選作品')).forEach(x=>
              slides.push({img:heroImg(x.cover),kicker:'Videography · '+(x.cat||'動態作品'),title:x.title||'',href:'dongtai.html?v='+encodeURIComponent(ytid(x.yt))}));
        if(slides.length<2)(a.albums||[]).forEach((al,i)=>{const ph=firstPhoto(al);
              if(ph)slides.push({img:heroImg(ph),kicker:'Photography · '+(al.zh||''),title:al.zh||'',href:al.slug?'pingmian.html?album='+al.slug:'pingmian.html?cat='+i});});
        if(!slides.length){window.loadSiteFont();return;}
        {const im=new Image();im.onload=im.onerror=()=>window.loadSiteFont();im.src=slides[0].img;}
        const box=document.getElementById('slides'),dots=document.getElementById('dots'),now=document.getElementById('now');
        const still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
        box.innerHTML=slides.map(sl=>`<div class="slide${still?'':' zoom'}" data-img="${esc(sl.img)}"></div>`).join('');
        const els=[...box.children];
        const load=i=>{const el=els[i];if(el.dataset.img){el.style.setProperty('--img',`url('${el.dataset.img}')`);delete el.dataset.img;}};
        if(slides.length>1)dots.innerHTML=slides.map((sl,i)=>`<button type="button" aria-label="第 ${i+1} 張:${esc(sl.title)}"></button>`).join('');
        let cur=-1,timer=null;
        function go(i){
              if(i===cur)return;
              load(i);load((i+1)%els.length);
              els.forEach((el,k)=>el.classList.toggle('on',k===i));
              [...dots.children].forEach((d,k)=>d.setAttribute('aria-current',String(k===i)));
              const sl=slides[i];now.hidden=false;now.href=sl.href;
              now.innerHTML=`<small>${esc(sl.kicker)}</small>${esc(sl.title)} →`;
              cur=i;
        }
        function play(){clearInterval(timer);if(!still&&els.length>1)timer=setInterval(()=>go((cur+1)%els.length),7000);}
        [...dots.children].forEach((d,k)=>d.addEventListener('click',()=>{go(k);play();}));
        document.addEventListener('visibilitychange',()=>{document.hidden?clearInterval(timer):play();});
        go(0);play();
    }

    /* 頂欄:一直可見,捲過主視覺後轉為米白底 */
    (function(){
        const bar=document.getElementById('topbar'),hero=document.getElementById('hero');
        const upd=()=>{bar.classList.toggle('solid',window.scrollY>hero.offsetTop+hero.offsetHeight-bar.offsetHeight);
            document.documentElement.style.setProperty('--barh',bar.offsetHeight+'px');};
        window.addEventListener('scroll',upd,{passive:true});window.addEventListener('resize',upd);upd();
        if('ResizeObserver' in window)new ResizeObserver(upd).observe(bar);
    })();

    Promise.all([
        fetch('content/albums.json').then(r=>r.json()).catch(()=>({albums:[]})),
        fetch('content/videos.json').then(r=>r.json()).catch(()=>({videos:[]})),
        fetch('content/gear.json').then(r=>r.json()).catch(()=>({gear:[]}))
      ]).then(([a,v,g])=>{
        const plane=[];
        (a.albums||[]).forEach((al,i)=>{
              if(al.projects&&al.projects.length){
                      al.projects.forEach((pj,j)=>plane.push({featured:pj.featured===true,href:al.slug&&pj.slug?`pingmian.html?album=${al.slug}&project=${pj.slug}`:`pingmian.html?cat=${i}&proj=${j}`,imgs:tileImgs(pj,1200),cap:pj.zh||al.zh,sub:al.zh}));
              }else{
                      plane.push({featured:al.featured===true,href:al.slug?`pingmian.html?album=${al.slug}`:`pingmian.html?cat=${i}`,imgs:tileImgs(al,1200),cap:al.zh,sub:al.en});
              }
        });
        /* 後台勾了「★ 首頁精選」就只顯示勾選的(順序依後台的分類／專案排序);一個都沒勾時顯示全部 */
        const planePick=plane.filter(x=>x.featured);
        addRow('平面作品','Photography','pingmian.html',planePick.length?planePick:plane,'lg');

                const vids=(v.videos||[]).filter(x=>x.yt&&(x.featured===true||x.cat==='精選作品')).map(x=>({href:'dongtai.html?v='+encodeURIComponent(ytid(x.yt)),img:x.cover?heroImg(x.cover,1200):`https://img.youtube.com/vi/${(String(x.yt).match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{11})/)||[0,x.yt])[1]}/hqdefault.jpg`,cap:x.title||'影片',sub:x.cat}));
        addRow('動態作品','Videography','dongtai.html',vids,'lg');

                const gear=(g.gear||[]).map((x,i)=>({href:'qicai.html?item='+encodeURIComponent(x.slug||i),img:gimg(x.image,700),product:!!x.image,icon:gearIcon(x.cat),cap:x.name||'器材',sub:x.cat}));
        addRow('器材租賃','Rental','qicai.html',gear);
        buildHero(v,a);
        restoreY();
    }).catch(()=>{rows.innerHTML='<div class="empty">作品載入中,請稍後重新整理。</div>';});

    /* 首頁內容是載入後才產生的,瀏覽器自動還原捲動位置常常失敗;
       離開前記下位置,按上一頁回來、內容產生後再捲回去 */
    function restoreY(){
        try{
            const nav=performance.getEntriesByType('navigation')[0];
            const y=+sessionStorage.getItem('homeY');
            if(!(nav&&nav.type==='back_forward'&&y>0))return;
            /* 字型、圖片陸續載入會改變頁面高度:穩定前多捲幾次,使用者一滑動就停止 */
            let stop=false;const halt=()=>{stop=true;};
            ['wheel','touchstart','keydown'].forEach(t=>window.addEventListener(t,halt,{once:true,passive:true}));
            const go=()=>{if(!stop)window.scrollTo(0,y);};
            requestAnimationFrame(go);[150,400,800,1500].forEach(ms=>setTimeout(go,ms));
            if(document.fonts)document.fonts.ready.then(go);
        }catch(e){}
    }
    window.addEventListener('pagehide',()=>{try{sessionStorage.setItem('homeY',String(window.scrollY));}catch(e){}});
</script>

<script>
/* 進站動畫的收尾與跳過 */
(function(){
  var root=document.documentElement,el=document.getElementById('intro');
  if(!el)return;
  if(!root.classList.contains('is-intro')){el.parentNode.removeChild(el);return;}
  var done=false,evs=['pointerdown','keydown','wheel','touchstart'];
  function end(){
    if(done)return;done=true;
    root.classList.remove('is-intro');if(el.parentNode)el.parentNode.removeChild(el);
    evs.forEach(function(t){removeEventListener(t,skip,true)});
  }
  function skip(){
    if(done)return;
    root.classList.remove('is-intro-hero');
    if(el.animate){var a=el.animate([{opacity:getComputedStyle(el).opacity},{opacity:0}],{duration:320,easing:'cubic-bezier(.7,0,.84,0)',fill:'forwards'});a.onfinish=end;}
    setTimeout(end,450);
  }
  evs.forEach(function(t){addEventListener(t,skip,{capture:true,passive:true})});
  el.addEventListener('animationend',function(e){if(e.target===el&&e.animationName==='intro-out')end();});
  setTimeout(end,2500);
})();
</script>
