<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聯絡我們 · 嶼光映像</title>
<style>
  :root{
    --paper:#f3f1ec;--paper-2:#eeece6;--ink:#171613;--muted:#a19a8d;
    --line:rgba(23,22,19,.14);--hair:rgba(23,22,19,.08);
    --serif:"Noto Serif TC","Songti TC",Georgia,"Times New Roman",serif;
    --sans:"PingFang TC","Noto Sans TC","Helvetica Neue",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{text-decoration:none;color:inherit}
  .wrap{max-width:1100px;margin:0 auto;padding:0 clamp(20px,5vw,64px)}

  .topbar{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;
    padding:15px clamp(20px,5vw,64px);background:var(--paper)}
  .topbar .mark{display:flex;align-items:center;gap:11px}
  .topbar svg{width:20px;height:auto}
  .topbar .name{font-family:var(--serif);font-size:14px;letter-spacing:5px;text-indent:5px}
  .topbar .back{font-family:var(--serif);font-size:12px;letter-spacing:2px;color:var(--muted);transition:.3s}
  .topbar .back:hover{color:var(--ink)}

  .pagehead{text-align:center;padding:clamp(16px,2.4vw,32px) 0 clamp(28px,4vw,52px)}
  .pagehead .kicker{font-family:var(--serif);font-size:12px;letter-spacing:6px;color:var(--muted);
    text-transform:uppercase;margin-bottom:12px}
  .pagehead h1{font-family:var(--serif);font-weight:500;font-size:clamp(2rem,5.4vw,3.2rem);letter-spacing:12px;text-indent:12px}
  .pagehead .sub{font-family:var(--serif);color:var(--muted);margin-top:16px;font-size:clamp(.85rem,1.8vw,1rem);letter-spacing:3px}

  .contact{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(36px,6vw,88px);
    padding-bottom:clamp(56px,8vw,100px);align-items:start}
  @media(max-width:760px){.contact{grid-template-columns:1fr;gap:44px}}

  /* 左:資訊 */
  .info .blk{padding:20px 0;border-top:1px solid var(--line)}
  .info .blk:first-child{border-top:0;padding-top:0}
  .info .blk .k{font-family:var(--serif);font-size:11px;letter-spacing:4px;color:var(--muted);text-transform:uppercase;margin-bottom:9px}
  .info .blk .v{font-family:var(--serif);font-size:clamp(1.05rem,1.8vw,1.25rem);letter-spacing:1px}
  .info .blk .v a{border-bottom:1px solid transparent;transition:.3s}
  .info .blk .v a:hover{border-bottom-color:var(--ink)}
  .info .blk .small{color:var(--muted);font-size:13px;letter-spacing:1px;line-height:1.9;margin-top:4px}
  .info .socials{display:flex;gap:20px;margin-top:6px}
  .info .socials a{font-family:var(--serif);font-size:14px;letter-spacing:2px;color:var(--muted);transition:.3s}
  .info .socials a:hover{color:var(--ink)}

  /* 右:表單 */
  .form .row{margin-bottom:26px}
  .form label{display:block;font-family:var(--serif);font-size:12px;letter-spacing:3px;color:var(--muted);
    text-transform:uppercase;margin-bottom:10px}
  .form input,.form select,.form textarea{width:100%;background:none;border:0;border-bottom:1px solid var(--line);
    padding:10px 2px;font-family:var(--sans);font-size:1rem;color:var(--ink);outline:none;transition:border-color .3s;
    border-radius:0}
  .form input:focus,.form select:focus,.form textarea:focus{border-bottom-color:var(--ink)}
  .form textarea{resize:vertical;min-height:110px;line-height:1.8}
  .form select{cursor:pointer}
  .form .submit{margin-top:8px;font-family:var(--serif);letter-spacing:3px;font-size:14px;color:var(--paper);
    background:var(--ink);border:0;padding:15px 44px;cursor:pointer;transition:.3s;outline:none}
  .form .submit:hover{opacity:.85}
  .form .hint{color:var(--muted);font-size:12px;letter-spacing:1px;margin-top:14px;line-height:1.8}

  .reveal{opacity:0;transform:translateY(22px);transition:.85s cubic-bezier(.19,1,.22,1)}
  .reveal.show{opacity:1;transform:none}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="logo" viewBox="0 0 192 208">
    <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="butt">
      <line x1="97" y1="8" x2="97" y2="200"/><line x1="127" y1="70" x2="165" y2="23"/>
      <line x1="99" y1="102" x2="184" y2="102"/><line x1="8" y1="94" x2="8" y2="200"/>
      <line x1="8" y1="200" x2="97" y2="200"/><line x1="97" y1="200" x2="184" y2="200"/>
      <line x1="184" y1="200" x2="184" y2="172"/>
    </g>
  </symbol>
</svg>

<div class="topbar">
  <a class="mark" href="index.html"><svg><use href="#logo"/></svg><span class="name">嶼光映像</span></a>
  <a class="back" href="index.html">← 返回首頁</a>
</div>

<div class="wrap">
  <div class="pagehead">
    <div class="kicker">Contact</div>
    <h1>聯絡我們</h1>
    <p class="sub">有任何影像需求，歡迎與我們聊聊</p>
  </div>

  <div class="contact">
    <!-- 左:聯絡資訊 -->
    <div class="info reveal">
      <div class="blk">
        <div class="k">Email</div>
        <div class="v"><a href="mailto:qqqq8413@gmail.com">qqqq8413@gmail.com</a></div>
      </div>
      <div class="blk">
        <div class="k">LINE</div>
        <div class="v"><a href="https://line.me/R/ti/p/~@qqqq8413">＠qqqq8413</a></div>
      </div>
      <div class="blk">
        <div class="k">Phone</div>
        <div class="v"><a href="tel:0908192807">0908 192 807</a></div>
      </div>
      <div class="blk">
        <div class="k">Studio</div>
        <div class="v">屏東縣屏東市公園里中華路 80-1 號</div>
        <div class="small">預約制，來訪前請先與我們聯繫</div>
      </div>
      <div class="blk">
        <div class="k">Hours</div>
        <div class="small">週一至週五　11:00–20:00<br>週末與假日　預約制</div>
      </div>
      <div class="blk">
        <div class="k">Follow</div>
        <div class="socials"><a href="#">Instagram</a><a href="#">Facebook</a><a href="#">YouTube</a></div>
      </div>
    </div>

    <!-- 右:表單 -->
    <form class="form reveal" id="form">
      <div class="row">
        <label>姓名 / Name</label>
        <input type="text" id="f-name" placeholder="您的稱呼" required>
      </div>
      <div class="row">
        <label>Email</label>
        <input type="email" id="f-email" placeholder="回覆用信箱" required>
      </div>
      <div class="row">
        <label>需求類型 / Service</label>
        <select id="f-type">
          <option>平面攝影</option>
          <option>動態影片</option>
          <option>企業形象</option>
          <option>器材租賃</option>
          <option>其他洽詢</option>
        </select>
      </div>
      <div class="row">
        <label>訊息 / Message</label>
        <textarea id="f-msg" placeholder="簡單描述你的需求、時間與預算，我們會盡快回覆"></textarea>
      </div>
      <button type="submit" class="submit">送出訊息</button>
      <p class="hint">送出後會開啟你的郵件軟體，內容已為你整理好，確認後寄出即可。</p>
    </form>
  </div>
</div>

<script>
  document.getElementById('form').addEventListener('submit',function(e){
    e.preventDefault();
    const name=document.getElementById('f-name').value.trim();
    const email=document.getElementById('f-email').value.trim();
    const type=document.getElementById('f-type').value;
    const msg=document.getElementById('f-msg').value.trim();
    const subject=`影像需求洽詢（${type}）— ${name||'未具名'}`;
    const body=`姓名：${name}\n聯絡信箱：${email}\n需求類型：${type}\n\n訊息：\n${msg}`;
    window.location.href=`mailto:qqqq8413@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  });

  const io=new IntersectionObserver((es)=>{
    es.forEach((e)=>{if(e.isIntersecting){e.target.classList.add('show');io.unobserve(e.target)}})
  },{threshold:.12});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
</body>
</html>
