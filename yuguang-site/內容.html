<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>內容管理 · 嶼光映像</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <style>
      :root{--paper:#f3f1ec;--paper2:#eeece6;--ink:#171613;--muted:#a19a8d;--line:rgba(23,22,19,.14);
                --serif:"Noto Serif TC","Songti TC",Georgia,serif;--sans:"PingFang TC","Noto Sans TC",system-ui,sans-serif;}
      *{margin:0;padding:0;box-sizing:border-box}
      body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
      .wrap{max-width:1000px;margin:0 auto;padding:0 clamp(16px,4vw,36px)}
      a{color:inherit}
      .top{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--line)}
      .top .brand{display:flex;align-items:center;gap:12px;text-decoration:none}
      .top svg.mk{width:22px}
      .top .name{font-family:var(--serif);font-size:15px;letter-spacing:5px}
      .top .name small{display:block;font-size:11px;letter-spacing:2px;color:var(--muted)}

      .gate{max-width:360px;margin:14vh auto;text-align:center}
      .gate svg{width:40px;margin-bottom:20px}
      .gate h1{font-family:var(--serif);font-weight:500;font-size:1.4rem;letter-spacing:6px;margin-bottom:8px}
      .gate p{color:var(--muted);font-size:13px;letter-spacing:1px;margin-bottom:24px}
      .gate input{width:100%;border:1px solid var(--line);background:none;padding:13px 14px;font-size:1rem;
                      outline:none;text-align:center;letter-spacing:2px}
      .gate input:focus{border-color:var(--ink)}
      .gate button{width:100%;margin-top:12px;background:var(--ink);color:var(--paper);border:0;padding:14px;
                       font-family:var(--serif);letter-spacing:4px;font-size:14px;cursor:pointer}
      .gate .err{color:#b04a3a;font-size:12px;margin-top:14px;min-height:16px}

      .tabs{display:flex;gap:8px;margin:24px 0 20px}
      .tabs button{font-family:var(--serif);font-size:14px;letter-spacing:2px;color:var(--muted);background:none;
                       border:1px solid var(--line);padding:9px 20px;cursor:pointer;transition:.2s}
      .tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
      .panel{display:none}.panel.on{display:block}
      .sechead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
      .sechead h2{font-family:var(--serif);font-weight:500;font-size:1.15rem;letter-spacing:3px}
      .btn{font-family:var(--serif);font-size:13px;letter-spacing:2px;padding:9px 16px;border:1px solid var(--ink);
               background:none;color:var(--ink);cursor:pointer;transition:.2s}
      .btn:hover{background:var(--ink);color:var(--paper)}
      .btn.dark{background:var(--ink);color:var(--paper)}
      .btn.dark:hover{opacity:.85}
      .btn.sm{font-size:12px;padding:6px 12px;letter-spacing:1px}
      .btn.ghost{border-color:var(--line);color:var(--muted)}
      .btn.ghost:hover{border-color:var(--ink);color:var(--ink);background:none}

      .card{background:#fff;border:1px solid var(--line);padding:16px 18px;margin-bottom:12px}
      .card .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
      .card .row.top{justify-content:space-between}
      .lbl{font-family:var(--serif);font-size:11px;letter-spacing:2px;color:var(--muted);display:block;margin-bottom:4px}
      input.f,textarea.f,select.f{width:100%;border:1px solid var(--line);background:var(--paper);padding:9px 10px;
                                      font-family:var(--sans);font-size:14px;color:var(--ink);outline:none}
      input.f:focus,textarea.f:focus,select.f:focus{border-color:var(--ink)}
      textarea.f{resize:vertical;min-height:64px;line-height:1.7}
      .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
      .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
      @media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}

      .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:12px}
      .thumb{border:1px solid var(--line);background:var(--paper2);position:relative}
      .thumb img{width:100%;height:100px;object-fit:cover;display:block}
      .thumb input{width:100%;border:0;border-top:1px solid var(--line);padding:6px 8px;font-size:12px;background:#fff;outline:none}
      .thumb .del{position:absolute;top:4px;right:4px;background:rgba(23,22,19,.7);color:#fff;border:0;
                      width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:13px;line-height:1}

      .savebar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);
                   padding:14px 0;display:flex;justify-content:flex-end;gap:12px;align-items:center;margin-top:8px}
      .savebar .msg{font-family:var(--serif);font-size:13px;letter-spacing:1px;color:var(--muted)}
      .albumcard .an{font-family:var(--serif);font-size:1.05rem;letter-spacing:1px}
      .hidden{display:none}
      .hint{color:var(--muted);font-size:12px;letter-spacing:.5px;margin-bottom:14px;line-height:1.7}
    </style>
  </head>
  <body>

    <svg width="0" height="0" style="position:absolute"><symbol id="mk" viewBox="0 0 192 208">
        <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="butt">
              <line x1="97" y1="8" x2="97" y2="200"/><line x1="127" y1="70" x2="165" y2="23"/>
              <line x1="99" y1="102" x2="184" y2="102"/><line x1="8" y1="94" x2="8" y2="200"/>
              <line x1="8" y1="200" x2="97" y2="200"/><line x1="97" y1="200" x2="184" y2="200"/>
              <line x1="184" y1="200" x2="184" y2="172"/></g></symbol></svg>

    <div id="gate" class="gate">
        <svg><use href="#mk"/></svg>
      <h1>內容管理</h1>
      <p>嶼光映像 · 網站內容後台</p>
      <input id="pw" type="password" placeholder="輸入管理密碼" autocomplete="current-password">
      <button id="enter">進入</button>
      <div class="err" id="gerr"></div>
    </div>
  
  <div id="app" class="hidden">
    <div class="wrap">
        <div class="top">
              <a class="brand" href="/後台"><svg class="mk"><use href="#mk"/></svg>
                      <span class="name">嶼光映像<small>內容管理</small></span></a>
              <a class="btn ghost sm" href="/後台">← 後台首頁</a>
        </div>
    
        <div class="tabs">
              <button data-tab="photo" class="on">平面作品 · 照片</button>
              <button data-tab="video">動態作品 · 影片</button>
              <button data-tab="gear">器材租賃</button>
        </div>
    
        <div id="p-photo" class="panel on"></div>
        <div id="p-video" class="panel"></div>
        <div id="p-gear" class="panel"></div>
    </div>
  </div>
  
  <script>
    const $=id=>document.getElementById(id);
    let KEY='', DATA={albums:[],videos:[],gear:[]}, curAlbum=-1, curProject=-1;

    /* 登入 */
    async function api(fn,opts={}){
        opts.headers=Object.assign({'x-admin-key':KEY},opts.headers||{});
        const r=await fetch('/.netlify/functions/'+fn,opts);
        let d={};try{d=await r.json()}catch(e){}
        return {status:r.status,data:d};
    }
    async function login(k){
        KEY=k;
        const {status}=await api('list-orders');
        if(status===401){$('gerr').textContent='密碼錯誤';return;}
        sessionStorage.setItem('yg_admin_key',k);
        $('gate').classList.add('hidden');$('app').classList.remove('hidden');
        await loadAll();
    }
    $('enter').onclick=()=>login($('pw').value.trim());
    $('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login($('pw').value.trim())});

    /* 載入內容 */
    async function loadAll(){
        const t=Date.now();
        const [a,v,g]=await Promise.all([
              fetch('/content/albums.json?t='+t).then(r=>r.json()).catch(()=>({albums:[]})),
              fetch('/content/videos.json?t='+t).then(r=>r.json()).catch(()=>({videos:[]})),
              fetch('/content/gear.json?t='+t).then(r=>r.json()).catch(()=>({gear:[]}))
            ]);
        DATA.albums=a.albums||[];DATA.videos=v.videos||[];DATA.gear=g.gear||[];
        renderPhoto();renderVideo();renderGear();
    }

    /* Cloudinary 上傳 */
    const CLOUDINARY_CLOUD='wy6xqh42';
    const CLOUDINARY_PRESET='yuguang';
    async function shrink(file){try{if(!/^image\//.test(file.type)||/gif/.test(file.type))return file;const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file);});let w=img.naturalWidth,h=img.naturalHeight;const MAX=2400;if(w<=MAX&&h<=MAX&&file.size<=8388608){URL.revokeObjectURL(img.src);return file;}if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}}const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85));URL.revokeObjectURL(img.src);return b&&b.size<file.size?b:file;}catch(e){return file;}}
    async function uploadImage(file){
        const fd=new FormData();
        fd.append('file',await shrink(file));
        fd.append('upload_preset',CLOUDINARY_PRESET);
        const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`,{method:'POST',body:fd});
        const data=await res.json().catch(()=>({}));
        if(!res.ok||!data.secure_url){
              throw new Error((data.error&&data.error.message)||'cloudinary-upload-failed');
        }
        return data.secure_url;
    }
    async function saveContent(path,dataObj,msg,btn){
        const old=btn?btn.textContent:'';if(btn){btn.textContent='儲存中…';btn.disabled=true;}
        const {status,data}=await api('save-content',{method:'POST',headers:{'Content-Type':'application/json'},
                                                          body:JSON.stringify({path,data:dataObj,message:msg})});
        if(btn){btn.textContent=old;btn.disabled=false;}
        if(data&&data.reason==='github-not-configured'){alert('尚未設定 GITHUB_TOKEN，請先在 Netlify 加上此環境變數。');return false;}
        if(status!==200||!(data&&data.ok)){alert('儲存失敗，請稍後再試。');return false;}
        return true;
    }
    function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
    function move(arr,i,d){const j=i+d;if(j<0||j>=arr.length)return;const t=arr[i];arr[i]=arr[j];arr[j]=t;}
    function sortArr(arr,o,n){const [it]=arr.splice(o,1);arr.splice(n,0,it);}
    function initSort(id,arr,after){const el=document.getElementById(id);if(!el||typeof Sortable==='undefined')return;new Sortable(el,{handle:'.drag',animation:150,ghostClass:'dragghost',onEnd:e=>{if(e.oldIndex===e.newIndex)return;sortArr(arr,e.oldIndex,e.newIndex);after&&after();}});}

    /* 分頁切換 */
    document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
        document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
        document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
        $('p-'+b.dataset.tab).classList.add('on');
    });

    /* 照片（分類 → 專案 → 照片） */
    function albumCount(al){if(al.projects&&al.projects.length)return al.projects.length+' 專案';return (al.photos||[]).length+' 張';}
    function renderPhoto(){
        const box=$('p-photo');
        if(curAlbum>=0 && DATA.albums[curAlbum]){return renderAlbumDetail();}
        let h='<div class="hint">分類是最上層（例如「人像寫真」）。點進去可建立「專案子相簿」依案子分類，或直接放照片。用滑鼠拖曳左側 ⣿ 調整分類順序（放開後自動儲存）。</div>';
        h+='<div class="sechead"><h2>分類列表</h2><button class="btn" onclick="addAlbum()">+ 新增分類</button></div>';
        h+='<div id="albumList">';
        DATA.albums.forEach((al,i)=>{
              h+=`<div class="card albumcard"><div class="row top">
                    <div class="row" style="align-items:center;gap:8px"><span class="drag" title="拖曳排序" style="cursor:grab;color:var(--muted);font-size:18px;line-height:1;user-select:none">⣿</span><span class="an">${esc(al.zh||'未命名分類')}</span>
                          <span style="color:var(--muted);font-size:13px;margin-left:8px">${albumCount(al)}</span></div>
                                <div class="row">
                                        <button class="btn sm" onclick="openAlbum(${i})">管理</button>
                                                <button class="btn sm ghost" onclick="delAlbum(${i})">刪除</button>
                                                      </div></div></div>`;
        });
        h+='</div>';
        if(!DATA.albums.length)h+='<div class="hint">目前沒有分類，點「新增分類」開始。</div>';
        box.innerHTML=h;
        initSort('albumList',DATA.albums,()=>{renderPhoto();saveContent('yuguang-site/content/albums.json',{albums:DATA.albums},'調整分類順序');});
    }
    function addAlbum(){
        const zh=prompt('分類名稱（中文）：');if(!zh)return;
        const en=prompt('英文名稱（可留空）：')||'';
        DATA.albums.push({zh,en,projects:[],photos:[]});renderPhoto();
    }
    function delAlbum(i){if(!confirm('確定刪除整個分類？'))return;DATA.albums.splice(i,1);renderPhoto();}
    function openAlbum(i){curAlbum=i;curProject=-1;renderAlbumDetail();}

    function photoTarget(mode){
        if(mode==='pj'){const pj=DATA.albums[curAlbum].projects[curProject];if(!Array.isArray(pj.photos))pj.photos=[];
                            return {photos:pj.photos, path:`DATA.albums[${curAlbum}].projects[${curProject}].photos`, rerender:renderProjectDetail};}
        const al=DATA.albums[curAlbum];if(!Array.isArray(al.photos))al.photos=[];
        return {photos:al.photos, path:`DATA.albums[${curAlbum}].photos`, rerender:renderAlbumDetail};
    }
    function photoUploaderHTML(mode){
        const t=photoTarget(mode);const rr=mode==='pj'?'renderProjectDetail':'renderAlbumDetail';
        let h=`<button class="btn dark" onclick="$('photoFile').click()">+ 上傳照片（可多選）</button>
              <input type="file" id="photoFile" accept="image/*" multiple class="hidden">`;
        h+='<div class="thumbs" id="thumbs">';
        t.photos.forEach((p,j)=>{
              h+=`<div class="thumb">
                    <span class="drag" title="拖曳排序" style="position:absolute;top:4px;left:4px;z-index:2;cursor:grab;color:#fff;background:rgba(0,0,0,.45);border-radius:3px;padding:1px 5px;font-size:14px;line-height:1.3;user-select:none">⣿</span>
                          <button class="del" onclick="${t.path}.splice(${j},1);${rr}()">×</button>
                                <img src="${esc(p.image)}" loading="lazy">
                                      <input value="${esc(p.caption||'')}" placeholder="說明（可留空）" oninput="${t.path}[${j}].caption=this.value">
                                            </div>`;
        });
        h+='</div>';
        return h;
    }
    function bindPhotoUploader(mode){
        const t=photoTarget(mode);
        initSort('thumbs',t.photos,()=>{t.rerender();const m=$('pmsg');if(m)m.textContent='順序已調整，記得按「儲存」';});
        $('photoFile').onchange=async e=>{
              const files=[...e.target.files];if(!files.length)return;const msg=$('pmsg');
              for(let k=0;k<files.length;k++){
                      msg.textContent=`上傳中 ${k+1}/${files.length}…`;
                      try{const path=await uploadImage(files[k]);t.photos.push({image:path,caption:''});}
                      catch(err){alert('有一張照片上傳失敗，檔案可能太大（單張上限 10MB）。');break;}
              }
              msg.textContent='照片已上傳，記得按「儲存」';t.rerender();
        };
    }

    function renderAlbumDetail(){
        const al=DATA.albums[curAlbum];const box=$('p-photo');
        if(!Array.isArray(al.projects))al.projects=[];if(!Array.isArray(al.photos))al.photos=[];
        let h=`<div class="sechead"><h2>${esc(al.zh)}</h2>
            <button class="btn ghost sm" onclick="curAlbum=-1;renderPhoto()">← 返回分類列表</button></div>`;
        h+=`<div class="grid2" style="margin-bottom:20px">
              <input class="f" value="${esc(al.zh)}" oninput="DATA.albums[${curAlbum}].zh=this.value" placeholder="分類中文名稱">
                    <input class="f" value="${esc(al.en||'')}" oninput="DATA.albums[${curAlbum}].en=this.value" placeholder="英文名稱（可留空）">
                          </div>`;
        h+='<div class="sechead" style="margin-top:6px"><h2 style="font-size:1.02rem">專案子相簿</h2><button class="btn sm" onclick="addProject()">+ 新增專案</button></div>';
        h+='<div class="hint">建立專案後，網站點進此分類會先看到各專案封面；沒有專案時，則直接顯示下方「未分專案照片」。用 ⣿ 可拖曳排序。</div>';
        h+='<div id="projList">';
        al.projects.forEach((pj,j)=>{
              h+=`<div class="card"><div class="row top">
                    <div class="row" style="align-items:center;gap:8px"><span class="drag" title="拖曳排序" style="cursor:grab;color:var(--muted);font-size:18px;line-height:1;user-select:none">⣿</span><span class="an">${esc(pj.zh||'未命名專案')}</span>
                          <span style="color:var(--muted);font-size:13px;margin-left:8px">${(pj.photos||[]).length} 張</span></div>
                                <div class="row">
                                        <button class="btn sm" onclick="openProject(${j})">管理照片</button>
                                                <button class="btn sm ghost" onclick="delProject(${j})">刪除</button>
                                                      </div></div></div>`;
        });
        h+='</div>';
        if(!al.projects.length)h+='<div class="hint">尚無專案。若不需要分專案，可直接在下方上傳照片。</div>';
        h+='<div class="sechead" style="margin-top:24px"><h2 style="font-size:1.02rem">未分專案照片</h2></div>';
        h+='<div class="hint">此區照片只有在「沒有建立任何專案」時，才會顯示在網站上。</div>';
        h+=photoUploaderHTML('al');
        h+=`<div class="savebar"><span class="msg" id="pmsg"></span>
            <button class="btn dark" onclick="savePhoto(this)">儲存</button></div>`;
        box.innerHTML=h;
        initSort('projList',al.projects,()=>{renderAlbumDetail();const m=$('pmsg');if(m)m.textContent='順序已調整，記得按「儲存」';});
        bindPhotoUploader('al');
    }
    function addProject(){
        const zh=prompt('專案名稱（中文）：');if(!zh)return;
        const en=prompt('英文名稱（可留空）：')||'';
        if(!Array.isArray(DATA.albums[curAlbum].projects))DATA.albums[curAlbum].projects=[];
        DATA.albums[curAlbum].projects.push({zh,en,photos:[]});renderAlbumDetail();
    }
    function delProject(j){if(!confirm('確定刪除這個專案（含裡面照片）？'))return;DATA.albums[curAlbum].projects.splice(j,1);renderAlbumDetail();}
    function openProject(j){curProject=j;renderProjectDetail();}

    function renderProjectDetail(){
        const al=DATA.albums[curAlbum];const pj=al.projects[curProject];const box=$('p-photo');
        if(!Array.isArray(pj.photos))pj.photos=[];
        let h=`<div class="sechead"><h2>${esc(al.zh)} · ${esc(pj.zh)}</h2>
            <button class="btn ghost sm" onclick="curProject=-1;renderAlbumDetail()">← 返回 ${esc(al.zh)}</button></div>`;
        h+=`<div class="grid2" style="margin-bottom:14px">
              <input class="f" value="${esc(pj.zh)}" oninput="DATA.albums[${curAlbum}].projects[${curProject}].zh=this.value" placeholder="專案中文名稱">
                    <input class="f" value="${esc(pj.en||'')}" oninput="DATA.albums[${curAlbum}].projects[${curProject}].en=this.value" placeholder="英文名稱（可留空）">
                          </div>`;
        h+=photoUploaderHTML('pj');
        h+=`<div class="savebar"><span class="msg" id="pmsg"></span>
            <button class="btn dark" onclick="savePhoto(this)">儲存</button></div>`;
        box.innerHTML=h;
        bindPhotoUploader('pj');
    }
    async function savePhoto(btn){
        const ok=await saveContent('yuguang-site/content/albums.json',{albums:DATA.albums},'更新相簿',btn);
        if(ok){const m=$('pmsg');if(m)m.textContent='已儲存 ✓ 網站約 1 分鐘後更新';}
    }

    /* 影片 */
    const CREDIT_TEMPLATE=['導演 Director','企劃 Producer','攝影 Cinematographer','燈光 Lighting','收音 Sound','剪輯 Editor','調色 Colorist','配樂 Music'].map(r=>r+'：').join(String.fromCharCode(10));function fillCredits(i){if(DATA.videos[i].credits&&!confirm('這部影片的 credit 已有內容，要用職稱範本覆蓋嗎?'))return;DATA.videos[i].credits=CREDIT_TEMPLATE;renderVideo();}const VIDEO_CATS=['企業形象','品牌形象','公部門合作','商業廣告','活動紀錄','微電影','音樂錄影帶 MV','短影音','人物專訪'];function catOptions(cur){const list=VIDEO_CATS.slice();if(cur&&cur!=='精選作品'&&list.indexOf(cur)<0)list.push(cur);const c0=(cur&&cur!=='精選作品')?cur:'';let o=`<option value=""${!c0?' selected':''} disabled>— 請選擇分類 —</option>`;o+=list.map(c=>`<option value="${esc(c)}"${c===c0?' selected':''}>${esc(c)}</option>`).join('');return o+'<option value="__custom__">＋ 自訂新分類…</option>';}function videoCatChange(i,val){if(val==='__custom__'){const c=(prompt('輸入新的分類名稱：')||'').trim();if(c)DATA.videos[i].cat=c;renderVideo();return;}DATA.videos[i].cat=val;}let curVideoCat=null; function allVideoCats(){const set=new Set(VIDEO_CATS);DATA.videos.forEach(v=>{if(v.cat)set.add(v.cat);});return [...set];} function addVideoCat(){const c=(prompt('輸入新分類名稱：')||'').trim();if(!c)return;curVideoCat=c;renderVideo();} function openVideoCat(c){curVideoCat=c;renderVideo();} function addVideoToCurrentCat(){DATA.videos.push({title:'',cat:curVideoCat||'',yt:'',client:'',year:'',featured:false,credits:CREDIT_TEMPLATE});renderVideo();} function isFeat(v){return v.featured===true;} function renderVideo(){ const box=$('p-video'); DATA.videos.forEach(v=>{if(v.featured===undefined)v.featured=(v.cat==='精選作品');if(v.cat==='精選作品')v.cat='';}); if(curVideoCat!==null)return renderVideoCat(); let h='<div class="hint">影片依分類整理。點分類進去可新增／管理該分類的影片。勾選「★ 精選影片」的作品，會出現在首頁與動態作品頁的「精選作品」區。</div>'; h+='<div class="sechead"><h2>影片分類</h2><button class="btn" onclick="addVideoCat()">+ 新增分類</button></div>'; const cats=allVideoCats(); h+='<div>'; const featN=DATA.videos.filter(isFeat).length; if(featN)h+=`<div class="card" style="background:#171613;color:#f3f1ec;border-color:#171613"><div class="row top"><div><span class="an">★ 精選影片</span><span style="opacity:.72;font-size:13px;margin-left:10px">${featN} 部 · 決定首頁與精選區的排列順序</span></div><div class="row"><button class="btn sm" style="border-color:#f3f1ec;color:#f3f1ec" onclick="openVideoCat('__featured__')">排序／管理</button></div></div></div>`; cats.forEach(c=>{const n=DATA.videos.filter(v=>v.cat===c).length;const f=DATA.videos.filter(v=>v.cat===c&&v.featured).length;h+=`<div class="card albumcard"><div class="row top"><div><span class="an">${esc(c)}</span><span style="color:var(--muted);font-size:13px;margin-left:10px">${n} 部影片${f?' · ★'+f:''}</span></div><div class="row"><button class="btn sm" onclick="openVideoCat('${esc(c)}')">管理影片</button></div></div></div>`;}); const un=DATA.videos.filter(v=>!v.cat).length; if(un)h+=`<div class="card albumcard"><div class="row top"><div><span class="an">未分類</span><span style="color:var(--muted);font-size:13px;margin-left:10px">${un} 部影片</span></div><div class="row"><button class="btn sm" onclick="openVideoCat('')">管理影片</button></div></div></div>`; h+='</div>'; if(!cats.length&&!un)h+='<div class="hint">目前沒有影片，點「新增分類」開始。</div>'; box.innerHTML=h; } function renderVideoCat(){ const box=$('p-video'); const feat=curVideoCat==='__featured__'; const label=feat?'★ 精選影片　拖曳可調整首頁與精選區的順序':(curVideoCat||'未分類'); let h=`<div class="sechead"><h2>${esc(label)}</h2><button class="btn ghost sm" onclick="curVideoCat=null;renderVideo()">← 返回分類列表</button></div>`; if(feat)h+='<div class="hint">這裡列出所有已勾選為精選的影片（跨分類）。用左側 ⠿ 拖曳排序，順序會直接套用到首頁與動態作品頁的「精選作品」區。取消勾選就會從精選移除。</div>'; if(!feat)h+=`<div style="margin-bottom:14px"><button class="btn" onclick="addVideoToCurrentCat()">+ 新增影片</button></div>`; h+='<div id="videoCatList">'; DATA.videos.forEach((v,i)=>{ if(feat?!isFeat(v):((v.cat||'')!==(curVideoCat||'')))return; h+=`<div class="card"><div class="row" style="align-items:center;gap:8px;margin-bottom:10px"><span class="drag" title="拖曳排序" style="cursor:grab;color:var(--muted);font-size:18px;line-height:1;user-select:none">⠿</span><span style="color:var(--muted);font-size:12px">拖曳可調整順序</span></div><div class="grid2"> <div><label class="lbl">影片標題</label><input class="f" value="${esc(v.title)}" oninput="DATA.videos[${i}].title=this.value"></div> <div><label class="lbl">分類（改這裡可移到其他分類）</label><select class="f" onchange="videoCatChange(${i},this.value)">${catOptions(v.cat)}</select></div> </div><div class="grid3" style="margin-top:12px"> <div><label class="lbl">YouTube 影片 ID</label><input class="f" value="${esc(v.yt||'')}" oninput="DATA.videos[${i}].yt=this.value" placeholder="例:abc123XYZ"></div> <div><label class="lbl">客戶(可留空)</label><input class="f" value="${esc(v.client||'')}" oninput="DATA.videos[${i}].client=this.value"></div> <div><label class="lbl">年份(可留空)</label><input class="f" value="${esc(v.year||'')}" oninput="DATA.videos[${i}].year=this.value"></div> </div> <label style="margin-top:12px;display:flex;align-items:center;gap:10px;cursor:pointer;padding:11px 14px;background:${v.featured?'#171613':'var(--paper2)'};border:1px solid ${v.featured?'#171613':'var(--line)'};color:${v.featured?'#f3f1ec':'var(--ink)'};transition:.2s"><input type="checkbox" style="width:16px;height:16px;cursor:pointer" ${v.featured?'checked':''} onchange="DATA.videos[${i}].featured=this.checked;renderVideoCat()"><span style="font-size:14px;letter-spacing:1px">★ 設為精選影片<span style="opacity:.7;font-size:12px;margin-left:8px">勾選後會出現在首頁與動態作品頁的「精選作品」區</span></span></label> <div style="margin-top:12px"><label class="lbl">副標題／概念(可留空)</label><input class="f" value="${esc(v.sub||'')}" oninput="DATA.videos[${i}].sub=this.value" placeholder="例:【島嶼的一天】"></div> <div style="margin-top:12px"><label class="lbl">簡介(可留空)</label><textarea class="f" oninput="DATA.videos[${i}].desc=this.value">${esc(v.desc||'')}</textarea></div> <div style="margin-top:12px"><div class="row" style="justify-content:space-between;align-items:center"><label class="lbl" style="margin:0">製作團隊 credit(每行一個,格式「職稱：姓名」,職稱已幫你填好,補上姓名即可)</label><button class="btn sm ghost" type="button" onclick="fillCredits(${i})">帶入職稱範本</button></div><textarea class="f" style="min-height:150px;margin-top:6px" oninput="DATA.videos[${i}].credits=this.value" placeholder="導演：王小明&#10;攝影：李大華">${esc(v.credits||'')}</textarea></div> <div class="row" style="justify-content:flex-end;margin-top:12px"> <button class="btn sm ghost" onclick="if(confirm('刪除這部影片?')){DATA.videos.splice(${i},1);renderVideoCat()}">刪除</button></div> </div>`; }); h+='</div>'; const cnt=DATA.videos.filter(v=>feat?isFeat(v):((v.cat||'')===(curVideoCat||''))).length; if(!cnt)h+='<div class="hint">'+(feat?'目前沒有精選影片。到各分類把想放上首頁的影片勾「★ 設為精選影片」。':'這個分類還沒有影片，點上面「+ 新增影片」加入。')+'</div>'; h+=`<div class="savebar"><span class="msg" id="vmsg"></span><button class="btn dark" onclick="saveVideo(this)">儲存影片</button></div>`; box.innerHTML=h; initSortCat(); } function initSortCat(){const el=document.getElementById('videoCatList');if(!el||typeof Sortable==='undefined')return;const feat=curVideoCat==='__featured__';new Sortable(el,{handle:'.drag',animation:150,onEnd:e=>{if(e.oldIndex===e.newIndex)return;const idxs=DATA.videos.map((v,i)=>i).filter(i=>feat?isFeat(DATA.videos[i]):((DATA.videos[i].cat||'')===(curVideoCat||'')));sortArr(DATA.videos,idxs[e.oldIndex],idxs[e.newIndex]);renderVideoCat();}});}
    async function saveVideo(btn){
        const ok=await saveContent('yuguang-site/content/videos.json',{videos:DATA.videos},'更新影片',btn);
        if(ok)$('vmsg').textContent='已儲存 ✓ 網站約 1 分鐘後更新';
    }

    /* 器材 */
    function renderGear(){
        const box=$('p-gear');
        let h='<div class="sechead"><h2>器材列表</h2><button class="btn" onclick="DATA.gear.push({name:\'\',cat:\'相機機身\',price:0,image:\'\',spec:\'\',desc:\'\'});renderGear()">+ 新增器材</button></div>';
        h+='<div id="gearList">';
        DATA.gear.forEach((g,i)=>{
              h+=`<div class="card"><div class="row" style="align-items:center;gap:8px;margin-bottom:10px"><span class="drag" title="拖曳排序" style="cursor:grab;color:var(--muted);font-size:18px;line-height:1;user-select:none">⣿</span><span style="color:var(--muted);font-size:12px">拖曳可調整順序</span></div><div class="grid3">
                    <div><label class="lbl">器材名稱</label><input class="f" value="${esc(g.name)}" oninput="DATA.gear[${i}].name=this.value"></div>
                          <div><label class="lbl">分類</label><input class="f" value="${esc(g.cat)}" oninput="DATA.gear[${i}].cat=this.value"></div>
                                <div><label class="lbl">日租價（數字）</label><input class="f" type="number" value="${esc(g.price)}" oninput="DATA.gear[${i}].price=Number(this.value)||0"></div>
                                      </div>
                                            <div style="margin-top:12px"><label class="lbl">規格（用 ・ 分隔）</label><input class="f" value="${esc(g.spec)}" oninput="DATA.gear[${i}].spec=this.value"></div>
                                                  <div style="margin-top:12px"><label class="lbl">介紹說明</label><textarea class="f" oninput="DATA.gear[${i}].desc=this.value">${esc(g.desc)}</textarea></div>
                                                        <div class="row" style="justify-content:space-between;margin-top:12px;align-items:center">
                                                                <div class="row" style="gap:10px;align-items:center">
                                                                          ${g.image?`<img src="${esc(g.image)}" style="width:56px;height:42px;object-fit:cover;border:1px solid var(--line)">`:'<span style="color:var(--muted);font-size:12px">尚無照片</span>'}
                                                                                    <button class="btn sm" onclick="gearImgIdx=${i};$('gearFile').click()">上傳器材照片</button>
                                                                                            </div>
                                                                                                    <div class="row" style="gap:8px;align-items:center">
                                                                                                              <button class="btn sm ghost" onclick="if(confirm('刪除這台器材?')){DATA.gear.splice(${i},1);renderGear()}">刪除</button>
                                                                                                                      </div>
                                                                                                                            </div></div>`;
        });
        h+='</div>';
        if(!DATA.gear.length)h+='<div class="hint">目前沒有器材。</div>';
        h+=`<input type="file" id="gearFile" accept="image/*" class="hidden">`;
        h+=`<div class="savebar"><span class="msg" id="gmsg"></span>
            <button class="btn dark" onclick="saveGear(this)">儲存器材</button></div>`;
        box.innerHTML=h;
        initSort('gearList',DATA.gear,()=>renderGear());
        $('gearFile').onchange=async e=>{
              const f=e.target.files[0];if(!f)return;const msg=$('gmsg');msg.textContent='上傳中…';
              try{const path=await uploadImage(f);DATA.gear[gearImgIdx].image=path;msg.textContent='照片已上傳，記得按「儲存器材」';renderGear();}
              catch(err){alert('上傳失敗，檔案可能太大（單張上限 10MB）。');}
        };
    }
    let gearImgIdx=-1;
    async function saveGear(btn){
        const ok=await saveContent('yuguang-site/content/gear.json',{gear:DATA.gear},'更新器材',btn);
        if(ok)$('gmsg').textContent='已儲存 ✓ 網站約 1 分鐘後更新';
    }

    /* 自動登入 */
    const sk=sessionStorage.getItem('yg_admin_key');
    if(sk)login(sk);
      </script>
  </body>
</html>
