backend:
  name: github
  repo: qqqq8413-cyber/yuguang-site
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

# 上傳的圖片存放位置（檔案在 repo 的 yuguang-site 子資料夾內）
media_folder: "yuguang-site/images"
public_folder: "/images"

locale: "zh_Hant"

# 品牌與網站連結(顯示在後台)
site_url: "https://super-bombolone-186f83.netlify.app"
display_url: "https://super-bombolone-186f83.netlify.app"
logo_url: "/images/logo.svg"

collections:
  # ── 網站設定(品牌 / 聯絡資訊) ──
  - name: "site"
    label: "網站設定"
    files:
      - name: "settings"
        label: "品牌與聯絡資訊"
        file: "yuguang-site/content/site.json"
        fields:
          - { name: brandZh, label: "品牌中文名", widget: string }
          - { name: brandEn, label: "品牌英文名", widget: string }
          - { name: email,   label: "Email",     widget: string }
          - { name: line,    label: "LINE ID",   widget: string }
          - { name: phone,   label: "電話",       widget: string }
          - { name: address, label: "地址",       widget: string }
          - { name: instagram, label: "Instagram 網址", widget: string, required: false }
          - { name: facebook,  label: "Facebook 網址",  widget: string, required: false }
          - { name: youtube,   label: "YouTube 網址",   widget: string, required: false }

  # ── 平面作品(相簿 / 照片) ──
  - name: "photography"
    label: "平面作品"
    files:
      - name: "albums"
        label: "相簿"
        file: "yuguang-site/content/albums.json"
        fields:
          - name: albums
            label: "相簿列表"
            label_singular: "相簿"
            widget: list
            summary: "{{fields.zh}}（{{fields.photos.length}} 張）"
            fields:
              - { name: zh, label: "相簿名稱（中文）", widget: string }
              - { name: en, label: "相簿名稱（英文）", widget: string, required: false }
              - name: photos
                label: "照片"
                label_singular: "照片"
                widget: list
                summary: "{{fields.caption}}"
                fields:
                  - { name: image, label: "照片", widget: image }
                  - { name: caption, label: "說明文字", widget: string, required: false }

  # ── 動態作品(影片) ──
  - name: "videography"
    label: "動態作品"
    files:
      - name: "videos"
        label: "影片"
        file: "yuguang-site/content/videos.json"
        fields:
          - name: videos
            label: "影片列表"
            label_singular: "影片"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title,  label: "影片標題", widget: string }
              - { name: cat,    label: "分類（會自動變成上方選項）", widget: string }
              - { name: client, label: "客戶", widget: string, required: false }
              - { name: year,   label: "年份", widget: string, required: false }
              - { name: yt,     label: "YouTube 影片 ID（網址 watch?v= 後那串）", widget: string, required: false }

  # ── 器材租賃 ──
  - name: "rental"
    label: "器材租賃"
    files:
      - name: "gear"
        label: "器材"
        file: "yuguang-site/content/gear.json"
        fields:
          - name: gear
            label: "器材列表"
            label_singular: "器材"
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name,  label: "器材名稱", widget: string }
              - { name: cat,   label: "分類（會自動變成側欄選項）", widget: string }
              - { name: price, label: "日租價（數字）", widget: number, value_type: int, min: 0 }
              - { name: image, label: "器材照片", widget: image, required: false }
              - { name: spec,  label: "規格（用 ・ 分隔，例如：全片幅・4K・雙原生ISO）", widget: string }
              - { name: desc,  label: "介紹說明", widget: text }

  # ── 製作流程 ──
  - name: "process"
    label: "製作流程"
    files:
      - name: "steps"
        label: "流程步驟"
        file: "yuguang-site/content/process.json"
        fields:
          - name: steps
            label: "步驟列表"
            label_singular: "步驟"
            widget: list
            summary: "{{fields.zh}}"
            fields:
              - { name: zh, label: "步驟名稱（中文）", widget: string }
              - { name: en, label: "步驟名稱（英文）", widget: string, required: false }
              - name: icon
                label: "圖示"
                widget: select
                options:
                  - { label: "對話框", value: chat }
                  - { label: "文件", value: doc }
                  - { label: "清單", value: list }
                  - { label: "攝影機", value: cam }
                  - { label: "調控滑桿", value: sliders }
                  - { label: "包裝盒", value: box }
              - { name: desc, label: "步驟說明", widget: text }

  # ── 關於嶼光 ──
  - name: "about"
    label: "關於嶼光"
    files:
      - name: "about"
        label: "關於頁內容"
        file: "yuguang-site/content/about.json"
        fields:
          - { name: manifesto, label: "開頭大字宣言", widget: text }
          - { name: storyHeading, label: "故事區小標（中文）", widget: string }
          - { name: story, label: "故事段落", widget: list, field: { name: p, label: "段落", widget: text } }
          - { name: sign, label: "署名", widget: string, required: false }
          - name: values
            label: "核心價值(三個)"
            label_singular: "價值"
            widget: list
            summary: "{{fields.zh}}"
            fields:
              - name: icon
                label: "圖示"
                widget: select
                options:
                  - { label: "光圈", value: aperture }
                  - { label: "愛心", value: heart }
                  - { label: "夥伴", value: people }
              - { name: en, label: "英文標籤", widget: string, required: false }
              - { name: zh, label: "價值標題（中文）", widget: string }
              - { name: desc, label: "說明", widget: text }
